# CI/CD for Life Ledger (ADR-0005, ADR-0011).
#
# One gated workflow: the `test` job runs on every pull request and every push
# to main; the `publish` job runs only on push to main, only after `test` passes,
# and only when image-affecting files changed. Publishing pushes the image to the
# public GHCR package as `:<sha>` and `:latest`; the mini-PC's digest-polling
# updater (deploy/minipc/guest/life-ledger-update.sh) picks `:latest` up on its
# own, so there is no deploy step here.
#
# Publish gate: rather than a whole-workflow `paths-ignore` skip (which would also
# skip `test` and leave the required check unreported on doc-only PRs), the
# `changes` job computes — with a `git diff` step — whether any image-affecting
# file changed. Docs-only / deploy-only pushes still run `test` but publish
# nothing; a mixed code+doc push publishes because code changed. When unsure the
# gate fails toward publishing.
#
# Image shape: single-platform linux/amd64, with provenance and SBOM attestations
# disabled so every package version is one standalone manifest that
# ghcr-cleanup.yml can delete safely.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  changes:
    name: changes
    runs-on: ubuntu-latest
    # Only the push-to-main publish path consumes this; PRs never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the pushed range's history for `git diff before..after`.
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ] \
             || ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            # First push, new branch, or a force-push whose old tip is no longer
            # reachable: fall back to the parent if there is one, else treat
            # everything as changed (fail toward publishing, never silently skip).
            if git rev-parse -q --verify "$AFTER^" >/dev/null; then
              changed=$(git diff --name-only "$AFTER^" "$AFTER")
            else
              changed=$(git ls-tree -r --name-only "$AFTER")
            fi
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          # A file is image-affecting unless it matches an ignore glob. `case`
          # patterns use `*` which spans `/`, so `*.md` == `**/*.md` and
          # `docs/*` == `docs/**`.
          image=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) ;;
              docs/*) ;;
              deploy/*) ;;
              .github/workflows/ghcr-cleanup.yml) ;;
              .agents/*) ;;
              .claude/*) ;;
              manual-process-samples/*) ;;
              *) image=true; break ;;
            esac
          done <<< "$changed"

          echo "image-affecting=$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Serialise image pushes so the :latest check-and-move below is atomic; never
    # cancel an in-flight push. Serialising alone does not keep merge order (the
    # `test` jobs race), so the move step also refuses to go backwards.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push to GHCR with the workflow's own GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/emepetres/life-ledger
    steps:
      - uses: actions/checkout@v4
        with:
          # The :latest guard needs history for `git merge-base --is-ancestor`.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Also logs crane in to ghcr.io with the workflow's GITHUB_TOKEN.
      - uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # :latest is moved separately below, only if this commit is newer.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Move :latest forward
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The commit :latest was built from. Empty if :latest is missing or
          # predates the revision label.
          current=$(crane config "$IMAGE:latest" 2>/dev/null \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' || true)
          echo "current :latest revision: ${current:-unknown}"
          if [ -n "$current" ] && git rev-parse -q --verify "$current^{commit}" >/dev/null \
             && ! git merge-base --is-ancestor "$current" "$SHA"; then
            # :latest is at a commit this one does not descend from, i.e. a
            # later merge already published. Leave it there.
            echo "::notice:::latest is at $current, which is not an ancestor of $SHA; not moving it."
            exit 0
          fi
          # Unknown or ancestor revision: move forward (fail toward publishing).
          # `crane tag` retags the same manifest, so the updater sees one digest.
          crane tag "$IMAGE:$SHA" latest
