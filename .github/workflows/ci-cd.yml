# CI/CD for Life Ledger (ADR-0005).
#
# One gated workflow: the `test` job runs on every pull request and every push
# to main; the `deploy` job runs only on push to main, only after `test` passes,
# and only when image-affecting files changed. Infrastructure is managed
# separately (infra.yml) — this workflow only builds the image and rolls a new
# revision.
#
# Deploy gate: rather than a whole-workflow `paths-ignore` skip (which would also
# skip `test` and leave the required check unreported on doc-only PRs), the
# `changes` job computes — with a `git diff` step — whether any image-affecting
# file changed. Docs-only / infra-only pushes still run `test` but roll no
# revision; a mixed code+doc push deploys because code changed. The ignore set
# below mirrors ADR-0005.
#
# Secret-drift discipline: CD only ever runs `az containerapp update --image`.
# It must never mutate env vars or ACA secrets, or it would orphan the
# Bicep-declared config (Bicep is the single source of truth — ADR-0005). The
# `test` job carries a guard step that fails if this file gains an
# env-/secret-mutating flag, so the discipline is enforced by the pipeline.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Secret-drift guard (ADR-0005). CD must only ever roll the image; if this
      # file gains an env-/secret-mutating flag it would orphan the Bicep-declared
      # config. Comment lines are stripped first, so a comment that mentions a
      # flag can't false-fail the build; the flag list is assembled from fragments
      # so the guard's own text never contains the literal `--<flag>` it scans for
      # (no self-match).
      - name: Guard - CD must not mutate env or secrets
        run: |
          set -euo pipefail
          flags='set-env-vars|replace-env-vars|remove-env-vars|remove-all-env-vars|secrets'
          if grep -vE '^[[:space:]]*#' .github/workflows/ci-cd.yml \
               | grep -nE "\-\-($flags)|containerapp[[:space:]]+secret"; then
            echo "::error::CD may only run 'az containerapp update --image ...'. Env vars and ACA secrets are Bicep-declared (ADR-0005); mutating them here would orphan that config. Change the value in infra/ and let infra.yml apply it."
            exit 1
          fi

  changes:
    name: changes
    runs-on: ubuntu-latest
    # Only the push-to-main deploy path consumes this; PRs never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the pushed range's history for `git diff before..after`.
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ] \
             || ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            # First push, new branch, or a force-push whose old tip is no longer
            # reachable: fall back to the parent if there is one, else treat
            # everything as changed (fail toward deploying, never silently skip).
            if git rev-parse -q --verify "$AFTER^" >/dev/null; then
              changed=$(git diff --name-only "$AFTER^" "$AFTER")
            else
              changed=$(git ls-tree -r --name-only "$AFTER")
            fi
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Changed files:"
          echo "$changed"

          # A file is image-affecting unless it matches an ignore glob. `case`
          # patterns use `*` which spans `/`, so `*.md` == `**/*.md` and
          # `docs/*` == `docs/**`.
          image=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) ;;
              docs/*) ;;
              infra/*) ;;
              .github/workflows/infra.yml) ;;
              .agents/*) ;;
              .claude/*) ;;
              manual-process-samples/*) ;;
              *) image=true; break ;;
            esac
          done <<< "$changed"

          echo "image-affecting=$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Serialise production deploys so two pushes can't race on the single revision.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC federated login to Azure (ADR-0005)
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: lifeledger # Bicep sets the app name to the base name.
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover ACR
        id: acr
        run: |
          set -euo pipefail
          name=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          server=$(az acr list -g "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          if [ -z "$name" ]; then
            echo "::error::No ACR found in resource group '$RESOURCE_GROUP'. Run the infra workflow first."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE: ${{ steps.acr.outputs.server }}/life-ledger
        run: |
          set -euo pipefail
          az acr login -n "${{ steps.acr.outputs.name }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Roll new revision
        env:
          IMAGE: ${{ steps.acr.outputs.server }}/life-ledger
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"
