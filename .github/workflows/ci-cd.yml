# CI/CD for Life Ledger (ADR-0005).
#
# One gated workflow: the `test` job runs on every pull request and every push
# to main; the `deploy` job runs only on push to main and only after `test`
# passes, so main is never deployed red. Infrastructure is managed separately
# (infra.yml) — this workflow only builds the image and rolls a new revision.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialise production deploys so two pushes can't race on the single revision.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC federated login to Azure (ADR-0005)
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: lifeledger # Bicep sets the app name to the base name.
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover ACR
        id: acr
        run: |
          set -euo pipefail
          name=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          server=$(az acr list -g "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          if [ -z "$name" ]; then
            echo "::error::No ACR found in resource group '$RESOURCE_GROUP'. Run the infra workflow first."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE: ${{ steps.acr.outputs.server }}/life-ledger
        run: |
          set -euo pipefail
          az acr login -n "${{ steps.acr.outputs.name }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Roll new revision
        env:
          IMAGE: ${{ steps.acr.outputs.server }}/life-ledger
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"
