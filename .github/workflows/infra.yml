# Infrastructure provisioning for Life Ledger (ADR-0005).
#
# Deliberately separate from the app-deploy workflow (ci-cd.yml). Applies the
# Bicep template that declares the ACR, storage, Container Apps environment, and
# the Container App. Runs on manual dispatch and automatically when anything
# under infra/ changes on main. Idempotent: re-running with no changes is a
# no-op, and it never clobbers the image CD deployed (Bicep pins :latest — ADR-0005).

name: infra

on:
  workflow_dispatch:
    inputs:
      containerImage:
        description: "First-run bootstrap only: set to mcr.microsoft.com/k8se/quickstart:latest before any image exists in ACR. Leave empty afterwards."
        required: false
        default: ""
      bootstrapProbePath:
        description: "First-run bootstrap only: HTTP probe path the placeholder answers (e.g. /). Leave empty afterwards so the probe reverts to /health."
        required: false
        default: ""
      bootstrapProbePort:
        description: "First-run bootstrap only: HTTP probe port the placeholder listens on (e.g. 80). Leave empty afterwards so the probe reverts to 8080."
        required: false
        default: ""
  # # push:
  # #   branches: [main]
  # #   paths:
  # #     - 'infra/**'
  # #     - '.github/workflows/infra.yml'

permissions:
  id-token: write # OIDC federated login to Azure (ADR-0005)
  contents: read

jobs:
  provision:
    name: provision
    runs-on: ubuntu-latest
    concurrency:
      group: infra-production
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      CONTAINER_IMAGE: ${{ github.event.inputs.containerImage }}
      BOOTSTRAP_PROBE_PATH: ${{ github.event.inputs.bootstrapProbePath }}
      BOOTSTRAP_PROBE_PORT: ${{ github.event.inputs.bootstrapProbePort }}
      PASSWORD_HASH: ${{ secrets.LIFELEDGER_PASSWORD_HASH }}
      SESSION_KEY: ${{ secrets.LIFELEDGER_SESSION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The resource group is created once during setup (see
      # docs/deployment/first-deploy.md, scripts/first-deploy.ps1) so the deploy
      # identity can be scoped to the group rather than the whole subscription.
      - name: Deploy Bicep
        run: |
          set -euo pipefail
          # Only forward the bootstrap probe overrides when the operator set them
          # (first run). Left empty, the Bicep defaults (/health:8080) apply, so a
          # steady-state re-apply automatically reverts the probe. An empty string
          # would set an invalid path and fail the int port param, so we omit them.
          probe_params=()
          if [ -n "$BOOTSTRAP_PROBE_PATH" ]; then
            probe_params+=(bootstrapProbePath="$BOOTSTRAP_PROBE_PATH")
          fi
          if [ -n "$BOOTSTRAP_PROBE_PORT" ]; then
            probe_params+=(bootstrapProbePort="$BOOTSTRAP_PROBE_PORT")
          fi
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$LOCATION" \
              containerImage="$CONTAINER_IMAGE" \
              passwordHash="$PASSWORD_HASH" \
              sessionKey="$SESSION_KEY" \
              "${probe_params[@]}"
